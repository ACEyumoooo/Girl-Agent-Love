title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        💡 Ideas are welcome. One sentence is fine, but the more specific it is, the easier it is to build.

        - Search first to see if a similar idea already exists
        - Explain the **problem you're trying to solve**, not just "add a feature"

  - type: textarea
    id: scenario
    attributes:
      label: Use case
      description: What were you doing when it felt inconvenient?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Desired outcome
      description: Write it like an acceptance criterion, e.g. "after clicking this button, the sprite should ..."
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround (optional)
      description: How do you get around this today?

  - type: dropdown
    id: area
    attributes:
      label: Scope
      options:
        - UI / GUI
        - Story and text generation
        - Sprites / backgrounds / image generation
        - Voice / BGM
        - Save / load / history
        - Configuration and settings
        - Docs and examples
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing ideas and found no duplicate
          required: true
