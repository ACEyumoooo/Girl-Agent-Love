name: 🐞 Bug report
description: Something in the framework is broken — errors, crashes, wrong behavior, or UI glitches
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check before submitting:

        - Ren'Py version is **8.5 or newer**
        - You're on the **latest main**, not an old download
        - `options.txt` / `key.txt` are configured as described in the README

        One issue per report. **Never paste API keys, tokens, or passwords** — they become public.

  - type: input
    id: framework-version
    attributes:
      label: Framework version
      description: Shown in the in-game About screen, or game/options.rpy (config.version)
      placeholder: 1.0-b
    validations:
      required: true

  - type: input
    id: renpy-version
    attributes:
      label: Ren'Py version
      placeholder: 8.5.3
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From launch, as concretely as possible
      placeholder: |
        1. Launch the game
        2. Open settings
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste traceback.txt, log.txt, or console output as text instead of a screenshot
      render: text

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Lines in options.txt related to the problem (model, image generation, voice, harness, etc.)
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Helpful for UI or sprite issues

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions and found no duplicate
          required: true
        - label: I did not include any API key or password in this report
          required: true
