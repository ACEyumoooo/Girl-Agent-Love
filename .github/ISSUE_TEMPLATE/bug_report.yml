name: 🐞 Bug 报告
description: 框架本身的错误：报错、崩溃、行为不对、界面异常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先确认：

        - Ren'Py 版本是 **8.5 或更新**
        - 用的是**最新 main**，不是很久以前下载的包
        - 已按 README 配好 `options.txt` / `key.txt`

        请一帖只说一件事。**不要贴 API key、token 或密码**，会公开泄漏。

  - type: input
    id: framework-version
    attributes:
      label: 框架版本
      description: 游戏内「关于」页，或 game/options.rpy 里的 config.version
      placeholder: 1.0-b
    validations:
      required: true

  - type: input
    id: renpy-version
    attributes:
      label: Ren'Py 版本
      placeholder: 8.5.3
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动开始，尽量写得能照着点出来
      placeholder: |
        1. 启动游戏
        2. 打开设置
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错原文
      description: 贴 traceback.txt、log.txt 或控制台输出，不要只截图
      render: text

  - type: textarea
    id: config
    attributes:
      label: 相关配置
      description: options.txt 里和问题有关的行（模型、生图、语音、harness 等）
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: 截图（可选）
      description: 界面或立绘问题时贴图更有用

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索现有 Issues 和 Discussions，确认没有重复
          required: true
        - label: 我没有在内容里贴 API key 或密码
          required: true
